name: Playwright Tests on Azure

on:
  push:
    branches: [main]

  pull_request:
    branches: [main]

  workflow_dispatch:
    inputs:
      environment:
        description: 'Select environment'
        required: true
        default: 'qa'
        type: choice
        options:
          - qa
          - uat

      browser:
        description: 'Select browser'
        required: true
        default: 'chromium'
        type: choice
        options:
          - chromium
          - firefox
          - webkit

      tag:
        description: 'Select test scope'
        required: true
        default: '@smoke'
        type: choice
        options:
          - '@smoke'
          - '@sanity'
          - '@regression'
          - 'all'

permissions:
  id-token: write
  contents: read

jobs:
  playwright:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Playwright tests on Azure
        env:
          PLAYWRIGHT_SERVICE_URL: ${{ secrets.PLAYWRIGHT_SERVICE_URL }}
          BASE_URL: ${{ secrets.BASE_URL }}
          TEST_ENV: ${{ inputs.environment }}
        run: |
          if [ "${{ inputs.tag }}" = "all" ]; then
            npx playwright test \
              -c playwright.service.config.js \
              --project=${{ inputs.browser }} \
              --workers=5
          else
            npx playwright test \
              -c playwright.service.config.js \
              --project=${{ inputs.browser }} \
              --grep="${{ inputs.tag }}" \
              --workers=5
          fi

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/